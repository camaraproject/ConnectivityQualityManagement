<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="960" height="620" fill="#f8f9fb" rx="12"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2340">Figure 1 — CQM APIs by Event Context</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#6b7280">Each row shows which APIs are applicable in a given context. This is illustrative, not a prescriptive selection guide.</text>

  <!-- Column headers -->
  <rect x="20" y="64" width="200" height="30" rx="4" fill="#e2e8f0"/>
  <text x="120" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Event context</text>

  <rect x="228" y="64" width="706" height="30" rx="4" fill="#e2e8f0"/>
  <text x="581" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Applicable CQM APIs (illustrative)</text>

  <!-- ═══ ROW 1 — Discovery (before / during) ═══ -->
  <rect x="20" y="102" width="200" height="66" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.3"/>
  <text x="120" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#3b5bdb">Before / during the event</text>
  <text x="120" y="137" text-anchor="middle" font-size="9.5" fill="#3b5bdb">Discover what the CSP</text>
  <text x="120" y="150" text-anchor="middle" font-size="9.5" fill="#3b5bdb">offers (profiles, areas)</text>

  <rect x="228" y="102" width="160" height="66" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.3"/>
  <text x="308" y="127" text-anchor="middle" font-size="10" font-weight="600" fill="#3b5bdb">qos-profiles</text>
  <text x="308" y="143" text-anchor="middle" font-size="9" fill="#6b7280">Discover available</text>
  <text x="308" y="156" text-anchor="middle" font-size="9" fill="#6b7280">QoS profiles</text>

  <rect x="396" y="102" width="200" height="66" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.3"/>
  <text x="496" y="127" text-anchor="middle" font-size="10" font-weight="600" fill="#3b5bdb">dedicated-network-profiles</text>
  <text x="496" y="143" text-anchor="middle" font-size="9" fill="#6b7280">Discover network</text>
  <text x="496" y="156" text-anchor="middle" font-size="9" fill="#6b7280">profiles (DN family)</text>

  <rect x="604" y="102" width="200" height="66" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="704" y="122" text-anchor="middle" font-size="10" font-weight="600" fill="#3b5bdb">dedicated-network-areas</text>
  <text x="704" y="138" text-anchor="middle" font-size="9" fill="#6b7280">Discover eligible</text>
  <text x="704" y="151" text-anchor="middle" font-size="9" fill="#6b7280">service areas</text>
  <text x="704" y="163" text-anchor="middle" font-size="8.5" fill="#9ca3af" font-style="italic">preview capability</text>

  <!-- ═══ ROW 2 — Spontaneous / unplanned ═══ -->
  <rect x="20" y="178" width="200" height="66" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.3"/>
  <text x="120" y="198" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1">Spontaneous / unplanned</text>
  <text x="120" y="213" text-anchor="middle" font-size="9.5" fill="#0369a1">Immediate need, no</text>
  <text x="120" y="226" text-anchor="middle" font-size="9.5" fill="#0369a1">prior reservation</text>

  <rect x="228" y="178" width="200" height="66" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.3"/>
  <text x="328" y="203" text-anchor="middle" font-size="10" font-weight="600" fill="#0369a1">quality-on-demand</text>
  <text x="328" y="219" text-anchor="middle" font-size="9" fill="#6b7280">Immediate time-bounded</text>
  <text x="328" y="232" text-anchor="middle" font-size="9" fill="#6b7280">QoS session</text>

  <rect x="436" y="178" width="200" height="66" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.3"/>
  <text x="536" y="198" text-anchor="middle" font-size="10" font-weight="600" fill="#0369a1">qos-profiles</text>
  <text x="536" y="214" text-anchor="middle" font-size="9" fill="#6b7280">Profile discovery can</text>
  <text x="536" y="227" text-anchor="middle" font-size="9" fill="#6b7280">also happen on-site</text>
  <text x="536" y="239" text-anchor="middle" font-size="8.5" fill="#9ca3af" font-style="italic">at recording session</text>

  <!-- ═══ ROW 3 — Recurrent / regular equipment ═══ -->
  <rect x="20" y="254" width="200" height="66" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="120" y="274" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">Recurrent equipment</text>
  <text x="120" y="289" text-anchor="middle" font-size="9.5" fill="#6d28d9">Same device used across</text>
  <text x="120" y="302" text-anchor="middle" font-size="9.5" fill="#6d28d9">multiple productions</text>

  <rect x="228" y="254" width="200" height="66" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="328" y="279" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">qos-provisioning</text>
  <text x="328" y="295" text-anchor="middle" font-size="9" fill="#6b7280">Persistent assignment</text>
  <text x="328" y="308" text-anchor="middle" font-size="9" fill="#6b7280">until revoked</text>

  <!-- ═══ ROW 4 — Planned (all APIs) ═══ -->
  <rect x="20" y="330" width="200" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="120" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Planned event</text>
  <text x="120" y="365" text-anchor="middle" font-size="9.5" fill="#92400e">Known in advance:</text>
  <text x="120" y="378" text-anchor="middle" font-size="9.5" fill="#92400e">time, place, devices</text>

  <rect x="228" y="330" width="160" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="308" y="355" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">quality-on-demand</text>
  <text x="308" y="371" text-anchor="middle" font-size="9" fill="#6b7280">On the day, once</text>
  <text x="308" y="384" text-anchor="middle" font-size="9" fill="#6b7280">resources confirmed</text>

  <rect x="396" y="330" width="160" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="476" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">qos-provisioning</text>
  <text x="476" y="366" text-anchor="middle" font-size="9" fill="#6b7280">If device already has</text>
  <text x="476" y="379" text-anchor="middle" font-size="9" fill="#6b7280">persistent assignment</text>

  <rect x="564" y="330" width="160" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="644" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">qos-booking</text>
  <text x="644" y="366" text-anchor="middle" font-size="9" fill="#6b7280">Single device,</text>
  <text x="644" y="379" text-anchor="middle" font-size="9" fill="#6b7280">future time + area</text>

  <rect x="732" y="330" width="200" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="832" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">qos-booking-and-assignment</text>
  <text x="832" y="366" text-anchor="middle" font-size="9" fill="#6b7280">Multiple devices,</text>
  <text x="832" y="379" text-anchor="middle" font-size="9" fill="#6b7280">assign/reassign over time</text>

  <!-- ═══ ROW 5 — Complex production (reserved environment) ═══ -->
  <rect x="20" y="406" width="200" height="66" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="120" y="426" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Complex production</text>
  <text x="120" y="441" text-anchor="middle" font-size="9.5" fill="#065f46">Multiple QoS profiles,</text>
  <text x="120" y="454" text-anchor="middle" font-size="9.5" fill="#065f46">device-access control</text>

  <rect x="228" y="406" width="200" height="66" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="328" y="426" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">dedicated-network</text>
  <text x="328" y="442" text-anchor="middle" font-size="9" fill="#6b7280">Reserved multi-profile</text>
  <text x="328" y="455" text-anchor="middle" font-size="9" fill="#6b7280">environment</text>

  <rect x="436" y="406" width="200" height="66" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="536" y="426" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">dedicated-network-accesses</text>
  <text x="536" y="442" text-anchor="middle" font-size="9" fill="#6b7280">Grant / revoke device</text>
  <text x="536" y="455" text-anchor="middle" font-size="9" fill="#6b7280">access to the environment</text>

  <rect x="644" y="406" width="200" height="66" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="744" y="421" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">quality-on-demand</text>
  <text x="744" y="437" text-anchor="middle" font-size="9" fill="#6b7280">Activate QoS sessions</text>
  <text x="744" y="450" text-anchor="middle" font-size="9" fill="#6b7280">within DN where supported</text>
  <text x="744" y="463" text-anchor="middle" font-size="8.5" fill="#9ca3af" font-style="italic">CSP-dependent</text>

  <!-- Bottom note -->
  <rect x="20" y="492" width="920" height="36" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="508" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">The same scenario may be addressed by different APIs depending on the API consumer need, CSP offering and market context.</text>
  <text x="480" y="521" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">Rows are independent — APIs do not need to be used in sequence. Dashed border indicates a preview capability.</text>

</svg>
