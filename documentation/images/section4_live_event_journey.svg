<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="960" height="580" fill="#f8f9fb" rx="12"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2340">Figure 1 — Common Journey: Live Event Connectivity</text>
  <text x="480" y="51" text-anchor="middle" font-size="11" fill="#6b7280">Illustrative situations — not a decision tree or prescriptive API selection guide</text>

  <!-- Timeline spine -->
  <line x1="60" y1="105" x2="900" y2="105" stroke="#c5cdd9" stroke-width="2.5"/>
  <!-- Arrow head -->
  <polygon points="900,100 912,105 900,110" fill="#c5cdd9"/>

  <!-- ═══════════════════════ NODE 1 — Before the event ═══════════════════════ -->
  <circle cx="100" cy="105" r="11" fill="#3b5bdb" stroke="white" stroke-width="2"/>
  <text x="100" y="88" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a2340">Before</text>
  <text x="100" y="77" text-anchor="middle" font-size="9.5" fill="#1a2340">the event</text>
  <line x1="100" y1="116" x2="100" y2="130" stroke="#3b5bdb" stroke-width="1.3" stroke-dasharray="3,2"/>
  <rect x="28" y="130" width="144" height="56" rx="8" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3"/>
  <text x="100" y="147" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3b5bdb">DISCOVERY</text>
  <text x="100" y="160" text-anchor="middle" font-size="8.5" fill="#3b5bdb">qos-profiles</text>
  <text x="100" y="173" text-anchor="middle" font-size="8.5" fill="#3b5bdb">dedicated-network-profiles</text>

  <!-- ═══════════════════════ NODE 2 — Spontaneous uplink ═══════════════════════ -->
  <circle cx="240" cy="105" r="11" fill="#0ea5e9" stroke="white" stroke-width="2"/>
  <text x="240" y="88" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a2340">Spontaneous</text>
  <text x="240" y="77" text-anchor="middle" font-size="9.5" fill="#1a2340">live uplink</text>
  <line x1="240" y1="116" x2="240" y2="130" stroke="#0ea5e9" stroke-width="1.3" stroke-dasharray="3,2"/>
  <rect x="168" y="130" width="144" height="56" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.3"/>
  <text x="240" y="147" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0369a1">ON-DEMAND</text>
  <text x="240" y="160" text-anchor="middle" font-size="8.5" fill="#0369a1">quality-on-demand</text>
  <text x="240" y="173" text-anchor="middle" font-size="8.5" fill="#0369a1">(or near-term reservation)</text>

  <!-- ═══════════════════════ NODE 3 — Regular equipment ═══════════════════════ -->
  <circle cx="390" cy="105" r="11" fill="#8b5cf6" stroke="white" stroke-width="2"/>
  <text x="390" y="88" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a2340">Regular field</text>
  <text x="390" y="77" text-anchor="middle" font-size="9.5" fill="#1a2340">equipment</text>
  <line x1="390" y1="116" x2="390" y2="130" stroke="#8b5cf6" stroke-width="1.3" stroke-dasharray="3,2"/>
  <rect x="318" y="130" width="144" height="56" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="390" y="147" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">LONG-LIVED</text>
  <text x="390" y="160" text-anchor="middle" font-size="8.5" fill="#6d28d9">qos-provisioning</text>
  <text x="390" y="173" text-anchor="middle" font-size="8.5" fill="#6d28d9">(persists until revoked)</text>

  <!-- ═══════════════════════ NODE 4 — Single-camera planned ═══════════════════════ -->
  <circle cx="560" cy="105" r="11" fill="#f59e0b" stroke="white" stroke-width="2"/>
  <text x="560" y="88" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a2340">Planned</text>
  <text x="560" y="77" text-anchor="middle" font-size="9.5" fill="#1a2340">single-camera</text>
  <line x1="560" y1="116" x2="560" y2="130" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="3,2"/>
  <rect x="488" y="130" width="144" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="560" y="147" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">RESERVATION</text>
  <text x="560" y="160" text-anchor="middle" font-size="8.5" fill="#92400e">qos-booking</text>
  <text x="560" y="173" text-anchor="middle" font-size="8.5" fill="#92400e">one device · one QoS profile</text>

  <!-- ═══════════════════════ NODE 5 — Multi-device OB ═══════════════════════ -->
  <circle cx="720" cy="105" r="11" fill="#ef4444" stroke="white" stroke-width="2"/>
  <text x="720" y="88" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a2340">Multi-device</text>
  <text x="720" y="77" text-anchor="middle" font-size="9.5" fill="#1a2340">outside broadcast</text>
  <line x1="720" y1="116" x2="720" y2="130" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="3,2"/>
  <rect x="648" y="130" width="144" height="56" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
  <text x="720" y="147" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">RESERVATION</text>
  <text x="720" y="160" text-anchor="middle" font-size="8.5" fill="#b91c1c">qos-booking-and-assignment</text>
  <text x="720" y="173" text-anchor="middle" font-size="8.5" fill="#b91c1c">decouple reservation / devices</text>

  <!-- ═══════════════════════ NODE 6 — Complex production ═══════════════════════ -->
  <circle cx="875" cy="105" r="11" fill="#059669" stroke="white" stroke-width="2"/>
  <text x="875" y="88" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a2340">Complex</text>
  <text x="875" y="77" text-anchor="middle" font-size="9.5" fill="#1a2340">production</text>
  <line x1="875" y1="116" x2="875" y2="220" stroke="#059669" stroke-width="1.3" stroke-dasharray="3,2"/>
  <rect x="796" y="220" width="152" height="68" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="872" y="238" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065f46">RESERVED ENV.</text>
  <text x="872" y="251" text-anchor="middle" font-size="8.5" fill="#065f46">dedicated-network</text>
  <text x="872" y="264" text-anchor="middle" font-size="8.5" fill="#065f46">dedicated-network-accesses</text>
  <text x="872" y="277" text-anchor="middle" font-size="8.5" fill="#065f46">+ QoD where supported</text>

  <!-- ═══════════════════════ Timing axis ═══════════════════════ -->
  <rect x="28" y="205" width="745" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="221" text-anchor="middle" font-size="9.5" fill="#64748b">← Immediate need ─────────────────────── Planned / reserved in advance ─────────────────────── Reserved environment →</text>

  <!-- ═══════════════════════ Legend ═══════════════════════ -->
  <rect x="28" y="318" width="745" height="226" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="400" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#1a2340">Legend — Illustrative CQM tools by situation</text>

  <!-- Legend row 1 -->
  <rect x="50" y="354" width="12" height="12" rx="3" fill="#3b5bdb"/>
  <text x="70" y="365" font-size="10" fill="#374151"><tspan font-weight="600">Discovery: </tspan>qos-profiles · dedicated-network-profiles · service-area discovery (preview capability)</text>

  <!-- Legend row 2 -->
  <rect x="50" y="375" width="12" height="12" rx="3" fill="#0ea5e9"/>
  <text x="70" y="386" font-size="10" fill="#374151"><tspan font-weight="600">On-demand: </tspan>quality-on-demand — immediate, time-bounded QoS session for one or more application flows</text>

  <!-- Legend row 3 -->
  <rect x="50" y="396" width="12" height="12" rx="3" fill="#8b5cf6"/>
  <text x="70" y="407" font-size="10" fill="#374151"><tspan font-weight="600">Long-lived assignment: </tspan>qos-provisioning — QoS profile associated with a device until revoked; no explicit time window</text>

  <!-- Legend row 4 -->
  <rect x="50" y="417" width="12" height="12" rx="3" fill="#f59e0b"/>
  <text x="70" y="428" font-size="10" fill="#374151"><tspan font-weight="600">Reservation (single device): </tspan>qos-booking — one device · one QoS profile · future time window · defined service area</text>

  <!-- Legend row 5 -->
  <rect x="50" y="438" width="12" height="12" rx="3" fill="#ef4444"/>
  <text x="70" y="449" font-size="10" fill="#374151"><tspan font-weight="600">Reservation (multi-device): </tspan>qos-booking-and-assignment — decouples reservation from device list; one QoS profile</text>

  <!-- Legend row 6 -->
  <rect x="50" y="459" width="12" height="12" rx="3" fill="#059669"/>
  <text x="70" y="470" font-size="10" fill="#374151"><tspan font-weight="600">Reserved environment: </tspan>dedicated-network + dedicated-network-accesses — multiple QoS profiles via network profile</text>

  <!-- Guardrail note -->
  <rect x="50" y="488" width="700" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="505" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">The illustrative tools shown above depend on CSP offering and market context. The same scenario may be addressed</text>
  <text x="400" y="520" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">differently depending on the API consumer need. This diagram is not a strict API selection guide.</text>

</svg>
