<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="960" height="560" fill="#f8f9fb" rx="12"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2340">Figure 2 — CQM Portfolio: Scope and Grouping by Purpose</text>
  <text x="480" y="51" text-anchor="middle" font-size="11" fill="#6b7280">APIs are grouped by the type of connectivity need they address — not by implementation order</text>

  <!-- ═══ Column widths: 5 groups across 900px usable, starting at x=30 ═══
       Group width = 172px, gap = 4px
       x positions: 30, 206, 382, 558, 734
  -->

  <!-- ═══════════ GROUP 1 — Discovery / Support ═══════════ -->
  <rect x="30" y="68" width="172" height="400" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.8"/>
  <!-- Header band -->
  <rect x="30" y="68" width="172" height="44" rx="10" fill="#3b5bdb"/>
  <rect x="30" y="98" width="172" height="14" fill="#3b5bdb"/>
  <text x="116" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="white">DISCOVERY</text>
  <text x="116" y="101" text-anchor="middle" font-size="9.5" fill="#c7d4f7">Support APIs</text>

  <!-- Purpose tag -->
  <rect x="46" y="124" width="140" height="32" rx="6" fill="white" stroke="#b4c5f7" stroke-width="1"/>
  <text x="116" y="137" text-anchor="middle" font-size="9" fill="#3b5bdb">Expose what the CSP offers</text>
  <text x="116" y="149" text-anchor="middle" font-size="9" fill="#3b5bdb">without changing connectivity</text>

  <!-- API pills -->
  <rect x="46" y="170" width="140" height="28" rx="6" fill="white" stroke="#3b5bdb" stroke-width="1.2"/>
  <text x="116" y="189" text-anchor="middle" font-size="10" font-weight="600" fill="#3b5bdb">qos-profiles</text>

  <rect x="46" y="208" width="140" height="28" rx="6" fill="white" stroke="#3b5bdb" stroke-width="1.2"/>
  <text x="116" y="227" text-anchor="middle" font-size="10" font-weight="600" fill="#3b5bdb">dedicated-network-profiles</text>

  <rect x="46" y="246" width="140" height="36" rx="6" fill="#f0f3ff" stroke="#3b5bdb" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="116" y="261" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3b5bdb">service-area discovery</text>
  <text x="116" y="274" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">dedicated-network-areas</text>

  <text x="116" y="310" text-anchor="middle" font-size="8" fill="#6b7280" font-style="italic">(dashed = preview capability)</text>

  <!-- Key dimension badges -->
  <rect x="46" y="370" width="60" height="20" rx="4" fill="#dbe4ff"/>
  <text x="76" y="384" text-anchor="middle" font-size="8.5" fill="#3b5bdb">No timing</text>
  <rect x="116" y="370" width="56" height="20" rx="4" fill="#dbe4ff"/>
  <text x="144" y="384" text-anchor="middle" font-size="8.5" fill="#3b5bdb">Catalogue</text>

  <!-- ═══════════ GROUP 2 — On-demand ═══════════ -->
  <rect x="206" y="68" width="172" height="400" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.8"/>
  <rect x="206" y="68" width="172" height="44" rx="10" fill="#0ea5e9"/>
  <rect x="206" y="98" width="172" height="14" fill="#0ea5e9"/>
  <text x="292" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="white">ON-DEMAND</text>
  <text x="292" y="101" text-anchor="middle" font-size="9.5" fill="#bae6fd">Immediate QoS</text>

  <rect x="222" y="124" width="140" height="32" rx="6" fill="white" stroke="#7dd3fc" stroke-width="1"/>
  <text x="292" y="137" text-anchor="middle" font-size="9" fill="#0369a1">Request a time-bounded</text>
  <text x="292" y="149" text-anchor="middle" font-size="9" fill="#0369a1">QoS session immediately</text>

  <rect x="222" y="170" width="140" height="28" rx="6" fill="white" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="292" y="189" text-anchor="middle" font-size="10" font-weight="600" fill="#0369a1">quality-on-demand</text>

  <!-- Dimensions -->
  <text x="292" y="226" text-anchor="middle" font-size="9" fill="#374151">· Immediate activation</text>
  <text x="292" y="241" text-anchor="middle" font-size="9" fill="#374151">· Bounded duration</text>
  <text x="292" y="256" text-anchor="middle" font-size="9" fill="#374151">· Application flows / device</text>
  <text x="292" y="271" text-anchor="middle" font-size="9" fill="#374151">· One QoS profile per session</text>
  <text x="292" y="286" text-anchor="middle" font-size="9" fill="#374151">· No explicit service area</text>

  <rect x="222" y="320" width="140" height="32" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="292" y="334" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">Session may not become</text>
  <text x="292" y="346" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">available if network cannot</text>

  <rect x="222" y="370" width="60" height="20" rx="4" fill="#bae6fd"/>
  <text x="252" y="384" text-anchor="middle" font-size="8.5" fill="#0369a1">Immediate</text>
  <rect x="292" y="370" width="60" height="20" rx="4" fill="#bae6fd"/>
  <text x="322" y="384" text-anchor="middle" font-size="8.5" fill="#0369a1">1 device</text>

  <!-- ═══════════ GROUP 3 — Long-lived ═══════════ -->
  <rect x="382" y="68" width="172" height="400" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.8"/>
  <rect x="382" y="68" width="172" height="44" rx="10" fill="#8b5cf6"/>
  <rect x="382" y="98" width="172" height="14" fill="#8b5cf6"/>
  <text x="468" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="white">LONG-LIVED</text>
  <text x="468" y="101" text-anchor="middle" font-size="9.5" fill="#ddd6fe">QoS Assignment</text>

  <rect x="398" y="124" width="140" height="32" rx="6" fill="white" stroke="#c4b5fd" stroke-width="1"/>
  <text x="468" y="137" text-anchor="middle" font-size="9" fill="#6d28d9">Persistent device-level QoS</text>
  <text x="468" y="149" text-anchor="middle" font-size="9" fill="#6d28d9">assignment until revoked</text>

  <rect x="398" y="170" width="140" height="28" rx="6" fill="white" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="468" y="189" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">qos-provisioning</text>

  <text x="468" y="226" text-anchor="middle" font-size="9" fill="#374151">· Configured in advance</text>
  <text x="468" y="241" text-anchor="middle" font-size="9" fill="#374151">· Applied when device connects</text>
  <text x="468" y="256" text-anchor="middle" font-size="9" fill="#374151">· Persists until revoked</text>
  <text x="468" y="271" text-anchor="middle" font-size="9" fill="#374151">· One QoS profile</text>
  <text x="468" y="286" text-anchor="middle" font-size="9" fill="#374151">· No explicit service area</text>

  <rect x="398" y="320" width="140" height="32" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="468" y="334" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">Not a guarantee of identical</text>
  <text x="468" y="346" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">performance at all locations</text>

  <rect x="398" y="370" width="60" height="20" rx="4" fill="#ddd6fe"/>
  <text x="428" y="384" text-anchor="middle" font-size="8.5" fill="#6d28d9">Persistent</text>
  <rect x="468" y="370" width="60" height="20" rx="4" fill="#ddd6fe"/>
  <text x="498" y="384" text-anchor="middle" font-size="8.5" fill="#6d28d9">1 device</text>

  <!-- ═══════════ GROUP 4 — Reservation-based ═══════════ -->
  <rect x="558" y="68" width="172" height="400" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="558" y="68" width="172" height="44" rx="10" fill="#f59e0b"/>
  <rect x="558" y="98" width="172" height="14" fill="#f59e0b"/>
  <text x="644" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="white">RESERVATION-BASED</text>
  <text x="644" y="101" text-anchor="middle" font-size="9.5" fill="#fde68a">Future time + service area</text>

  <rect x="574" y="124" width="140" height="32" rx="6" fill="white" stroke="#fcd34d" stroke-width="1"/>
  <text x="644" y="137" text-anchor="middle" font-size="9" fill="#92400e">Reserve connectivity quality</text>
  <text x="644" y="149" text-anchor="middle" font-size="9" fill="#92400e">in advance for future use</text>

  <rect x="574" y="170" width="140" height="28" rx="6" fill="white" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="644" y="189" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">qos-booking</text>

  <rect x="574" y="208" width="140" height="28" rx="6" fill="white" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="644" y="222" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400e">qos-booking-and-assignment</text>
  <text x="644" y="232" text-anchor="middle" font-size="8" fill="#b45309">(+ device assignment)</text>

  <rect x="574" y="246" width="140" height="28" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="644" y="260" text-anchor="middle" font-size="9.5" font-weight="600" fill="#d97706">dedicated-network</text>
  <text x="644" y="271" text-anchor="middle" font-size="8.5" fill="#b45309">(multi-profile environment)</text>

  <text x="644" y="315" text-anchor="middle" font-size="9" fill="#374151">· Future time window</text>
  <text x="644" y="330" text-anchor="middle" font-size="9" fill="#374151">· Defined service area</text>
  <text x="644" y="345" text-anchor="middle" font-size="9" fill="#374151">· 1 to many devices</text>

  <rect x="574" y="370" width="60" height="20" rx="4" fill="#fde68a"/>
  <text x="604" y="384" text-anchor="middle" font-size="8.5" fill="#92400e">Planned</text>
  <rect x="644" y="370" width="60" height="20" rx="4" fill="#fde68a"/>
  <text x="674" y="384" text-anchor="middle" font-size="8.5" fill="#92400e">1–N devices</text>

  <!-- ═══════════ GROUP 5 — Device-access management ═══════════ -->
  <rect x="734" y="68" width="196" height="400" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <rect x="734" y="68" width="196" height="44" rx="10" fill="#059669"/>
  <rect x="734" y="98" width="196" height="14" fill="#059669"/>
  <text x="832" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="white">DEVICE-ACCESS MGMT</text>
  <text x="832" y="101" text-anchor="middle" font-size="9.5" fill="#a7f3d0">Reserved environment</text>

  <rect x="750" y="124" width="164" height="32" rx="6" fill="white" stroke="#6ee7b7" stroke-width="1"/>
  <text x="832" y="137" text-anchor="middle" font-size="9" fill="#065f46">Control which devices access</text>
  <text x="832" y="149" text-anchor="middle" font-size="9" fill="#065f46">a reserved environment</text>

  <rect x="750" y="170" width="164" height="28" rx="6" fill="white" stroke="#059669" stroke-width="1.2"/>
  <text x="832" y="189" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">dedicated-network-accesses</text>

  <text x="832" y="230" text-anchor="middle" font-size="9" fill="#374151">· Companion to dedicated-network</text>
  <text x="832" y="245" text-anchor="middle" font-size="9" fill="#374151">· Grant / revoke device access</text>
  <text x="832" y="260" text-anchor="middle" font-size="9" fill="#374151">· Follows reserved env. lifecycle</text>
  <text x="832" y="275" text-anchor="middle" font-size="9" fill="#374151">· Service area inherited</text>

  <rect x="750" y="310" width="164" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="832" y="326" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">QoD may activate sessions</text>
  <text x="832" y="338" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">within a Dedicated Network</text>
  <text x="832" y="350" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">where CSP supports this</text>

  <rect x="750" y="370" width="76" height="20" rx="4" fill="#a7f3d0"/>
  <text x="788" y="384" text-anchor="middle" font-size="8.5" fill="#065f46">Env. lifecycle</text>
  <rect x="836" y="370" width="60" height="20" rx="4" fill="#a7f3d0"/>
  <text x="866" y="384" text-anchor="middle" font-size="8.5" fill="#065f46">N devices</text>

  <!-- ═══════════ Bottom note ═══════════ -->
  <rect x="30" y="490" width="900" height="50" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="480" y="509" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">Discovery APIs do not change connectivity behaviour. On-demand, long-lived and reservation-based APIs each address a different connectivity timing and scope.</text>
  <text x="480" y="527" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">Actual API availability depends on CSP offering and market context. Preview capabilities are explicitly labelled. This grouping is illustrative, not prescriptive.</text>

</svg>
