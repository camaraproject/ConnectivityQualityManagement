<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <rect width="960" height="580" fill="#f8f9fb" rx="12"/>

  <text x="480" y="42" text-anchor="middle" font-size="11" fill="#6b7280">APIs grouped by the type of connectivity need they address. Dashed border indicates a preview capability.</text>

  <!-- GROUP 1 — DISCOVERY -->
  <rect x="20" y="68" width="172" height="400" rx="10" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.8"/>
  <rect x="20" y="68" width="172" height="44" rx="10" fill="#3b5bdb"/>
  <rect x="20" y="98" width="172" height="14" fill="#3b5bdb"/>
  <text x="106" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="white">DISCOVERY</text>
  <text x="106" y="102" text-anchor="middle" font-size="9" fill="#c7d4f7">Support APIs</text>

  <rect x="36" y="124" width="140" height="34" rx="6" fill="white" stroke="#b4c5f7" stroke-width="1"/>
  <text x="106" y="138" text-anchor="middle" font-size="9" fill="#3b5bdb">Expose what the CSP offers</text>
  <text x="106" y="151" text-anchor="middle" font-size="9" fill="#3b5bdb">without changing connectivity</text>

  <rect x="36" y="168" width="140" height="28" rx="6" fill="white" stroke="#3b5bdb" stroke-width="1.2"/>
  <text x="106" y="187" text-anchor="middle" font-size="10" font-weight="600" fill="#3b5bdb">qos-profiles</text>

  <rect x="36" y="204" width="140" height="28" rx="6" fill="white" stroke="#3b5bdb" stroke-width="1.2"/>
  <text x="106" y="223" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3b5bdb">dedicated-network-profiles</text>

  <rect x="36" y="240" width="140" height="36" rx="6" fill="#f0f3ff" stroke="#3b5bdb" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="106" y="255" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3b5bdb">dedicated-network-areas</text>
  <text x="106" y="269" text-anchor="middle" font-size="8.5" fill="#9ca3af" font-style="italic">preview capability</text>

  <rect x="36" y="372" width="60" height="20" rx="4" fill="#dbe4ff"/>
  <text x="66" y="386" text-anchor="middle" font-size="8.5" fill="#3b5bdb">No timing</text>
  <rect x="106" y="372" width="56" height="20" rx="4" fill="#dbe4ff"/>
  <text x="134" y="386" text-anchor="middle" font-size="8.5" fill="#3b5bdb">Catalog</text>

  <!-- GROUP 2 — ON-DEMAND -->
  <rect x="200" y="68" width="172" height="400" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.8"/>
  <rect x="200" y="68" width="172" height="44" rx="10" fill="#0ea5e9"/>
  <rect x="200" y="98" width="172" height="14" fill="#0ea5e9"/>
  <text x="286" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="white">ON-DEMAND</text>
  <text x="286" y="102" text-anchor="middle" font-size="9" fill="#bae6fd">Immediate QoS session</text>

  <rect x="216" y="124" width="140" height="34" rx="6" fill="white" stroke="#7dd3fc" stroke-width="1"/>
  <text x="286" y="138" text-anchor="middle" font-size="9" fill="#0369a1">Request a time-bounded</text>
  <text x="286" y="151" text-anchor="middle" font-size="9" fill="#0369a1">QoS session immediately</text>

  <rect x="216" y="168" width="140" height="28" rx="6" fill="white" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="286" y="187" text-anchor="middle" font-size="10" font-weight="600" fill="#0369a1">quality-on-demand</text>

  <text x="286" y="228" text-anchor="middle" font-size="9" fill="#374151">Immediate activation</text>
  <text x="286" y="243" text-anchor="middle" font-size="9" fill="#374151">Bounded duration</text>
  <text x="286" y="258" text-anchor="middle" font-size="9" fill="#374151">Per application flow / device</text>
  <text x="286" y="273" text-anchor="middle" font-size="9" fill="#374151">One QoS profile per session</text>

  <rect x="216" y="316" width="140" height="44" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="286" y="331" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">Session may not become</text>
  <text x="286" y="344" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">available or may get dropped,</text>
  <text x="286" y="357" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">depending on conditions</text>

  <rect x="216" y="372" width="64" height="20" rx="4" fill="#bae6fd"/>
  <text x="248" y="386" text-anchor="middle" font-size="8.5" fill="#0369a1">Immediate</text>
  <rect x="288" y="372" width="56" height="20" rx="4" fill="#bae6fd"/>
  <text x="316" y="386" text-anchor="middle" font-size="8.5" fill="#0369a1">1 device</text>

  <!-- GROUP 3 — LONG-LIVED -->
  <rect x="380" y="68" width="172" height="400" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.8"/>
  <rect x="380" y="68" width="172" height="44" rx="10" fill="#8b5cf6"/>
  <rect x="380" y="98" width="172" height="14" fill="#8b5cf6"/>
  <text x="466" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="white">LONG-LIVED</text>
  <text x="466" y="102" text-anchor="middle" font-size="9" fill="#ddd6fe">Persistent QoS assignment</text>

  <rect x="396" y="124" width="140" height="34" rx="6" fill="white" stroke="#c4b5fd" stroke-width="1"/>
  <text x="466" y="138" text-anchor="middle" font-size="9" fill="#6d28d9">Persistent device-level QoS</text>
  <text x="466" y="151" text-anchor="middle" font-size="9" fill="#6d28d9">assignment until revoked</text>

  <rect x="396" y="168" width="140" height="28" rx="6" fill="white" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="466" y="187" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">qos-provisioning</text>

  <text x="466" y="228" text-anchor="middle" font-size="9" fill="#374151">Configured in advance</text>
  <text x="466" y="243" text-anchor="middle" font-size="9" fill="#374151">Applied when device connects</text>
  <text x="466" y="258" text-anchor="middle" font-size="9" fill="#374151">Persists until revoked</text>
  <text x="466" y="273" text-anchor="middle" font-size="9" fill="#374151">One QoS profile</text>

  <rect x="396" y="316" width="140" height="44" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="466" y="331" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">No guarantee for identical</text>
  <text x="466" y="344" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">performance at all locations</text>
  <text x="466" y="357" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">and all times</text>

  <rect x="396" y="372" width="64" height="20" rx="4" fill="#ddd6fe"/>
  <text x="428" y="386" text-anchor="middle" font-size="8.5" fill="#6d28d9">Persistent</text>
  <rect x="468" y="372" width="56" height="20" rx="4" fill="#ddd6fe"/>
  <text x="496" y="386" text-anchor="middle" font-size="8.5" fill="#6d28d9">1 device</text>

  <!-- RESERVATION-BASED SUPER-GROUP (x=558, w=382) -->
  <rect x="558" y="68" width="382" height="400" rx="10" fill="#fafaf9" stroke="#57534e" stroke-width="1.4"/>
  <rect x="558" y="68" width="382" height="34" rx="10" fill="#57534e"/>
  <rect x="558" y="90" width="382" height="12" fill="#57534e"/>
  <text x="749" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="white">RESERVATION-BASED</text>

  <!-- SUB-GROUP A — BOOKING -->
  <rect x="564" y="108" width="184" height="354" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="564" y="108" width="184" height="28" rx="8" fill="#f59e0b"/>
  <rect x="564" y="128" width="184" height="8" fill="#f59e0b"/>
  <text x="656" y="126" text-anchor="middle" font-size="10" font-weight="700" fill="white">BOOKING</text>

  <rect x="574" y="144" width="164" height="34" rx="6" fill="white" stroke="#fcd34d" stroke-width="1"/>
  <text x="656" y="158" text-anchor="middle" font-size="9" fill="#92400e">Reserve connectivity quality</text>
  <text x="656" y="171" text-anchor="middle" font-size="9" fill="#92400e">for a defined time and area</text>

  <rect x="574" y="186" width="164" height="28" rx="6" fill="white" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="656" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">qos-booking</text>

  <rect x="574" y="220" width="164" height="38" rx="6" fill="white" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="656" y="237" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400e">qos-booking-and-assignment</text>
  <text x="656" y="252" text-anchor="middle" font-size="8.5" fill="#92400e">(+ device assignment)</text>

  <text x="656" y="278" text-anchor="middle" font-size="9" fill="#374151">Immediate or future</text>
  <text x="656" y="293" text-anchor="middle" font-size="9" fill="#374151">Defined service area</text>
  <text x="656" y="308" text-anchor="middle" font-size="9" fill="#374151">One QoS profile</text>
  <text x="656" y="323" text-anchor="middle" font-size="9" fill="#374151">1 device or N devices</text>

  <rect x="574" y="340" width="164" height="34" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="656" y="354" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">Activation timing depends</text>
  <text x="656" y="367" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">on network operator</text>

  <rect x="574" y="386" width="88" height="20" rx="4" fill="#fde68a"/>
  <text x="618" y="400" text-anchor="middle" font-size="8.5" fill="#92400e">Immediate / future</text>
  <rect x="668" y="386" width="68" height="20" rx="4" fill="#fde68a"/>
  <text x="702" y="400" text-anchor="middle" font-size="8.5" fill="#92400e">Service area</text>

  <!-- SUB-GROUP B — RESERVED ENVIRONMENT -->
  <rect x="754" y="108" width="180" height="354" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <rect x="754" y="108" width="180" height="28" rx="8" fill="#059669"/>
  <rect x="754" y="128" width="180" height="8" fill="#059669"/>
  <text x="844" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">RESERVED ENVIRONMENT</text>

  <rect x="764" y="144" width="160" height="34" rx="6" fill="white" stroke="#6ee7b7" stroke-width="1"/>
  <text x="844" y="158" text-anchor="middle" font-size="9" fill="#065f46">Multi-profile connectivity</text>
  <text x="844" y="171" text-anchor="middle" font-size="9" fill="#065f46">environment with access control</text>

  <rect x="764" y="186" width="160" height="28" rx="6" fill="white" stroke="#059669" stroke-width="1.2"/>
  <text x="844" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">dedicated-network</text>

  <rect x="764" y="220" width="160" height="28" rx="6" fill="white" stroke="#059669" stroke-width="1.2"/>
  <text x="844" y="239" text-anchor="middle" font-size="9.5" font-weight="600" fill="#065f46">dedicated-network-accesses</text>

  <text x="844" y="270" text-anchor="middle" font-size="9" fill="#374151">Immediate or future</text>
  <text x="844" y="285" text-anchor="middle" font-size="9" fill="#374151">Defined service area</text>
  <text x="844" y="300" text-anchor="middle" font-size="9" fill="#374151">Multiple QoS profiles</text>
  <text x="844" y="315" text-anchor="middle" font-size="9" fill="#374151">Multiple devices</text>
  <text x="844" y="330" text-anchor="middle" font-size="9" fill="#374151">Device-access control</text>

  <rect x="764" y="346" width="160" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="844" y="360" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">May compose with QoD</text>
  <text x="844" y="373" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">where CSP supports it</text>

  <rect x="764" y="386" width="68" height="20" rx="4" fill="#a7f3d0"/>
  <text x="798" y="400" text-anchor="middle" font-size="8.5" fill="#065f46">N profiles</text>
  <rect x="840" y="386" width="68" height="20" rx="4" fill="#a7f3d0"/>
  <text x="874" y="400" text-anchor="middle" font-size="8.5" fill="#065f46">N devices</text>

  <!-- Bottom note -->
  <rect x="20" y="490" width="920" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="480" y="510" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">Discovery APIs do not change connectivity behaviour. On-demand and long-lived tools apply a QoS profile dynamically or persistently.</text>
  <text x="480" y="525" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">Reservation-based tools allow planning connectivity quality in advance — via booking or via a reserved multi-profile environment.</text>
  <text x="480" y="545" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">Actual API availability depends on CSP offering and market context. Dashed border = preview capability. This grouping is illustrative, not prescriptive.</text>
</svg>
